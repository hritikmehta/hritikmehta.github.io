<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Trip Checklist — 30 Sundays</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink:        #FD014F;
      --pink-mid:    #ff4d7d;
      --pink-bg:     #fff0f4;
      --pink-border: rgba(253,1,79,0.15);
      --cream:       #fff6e6;
      --cream-warm:  #fdf0dc;
      --cream-deep:  #f5e6cc;
      --grey-bg:     #f4f4f4;
      --grey-text:   #aaaaaa;
      --dark:        #1c1c1e;
      --mid:         #555;
      --white:       #ffffff;
      --green:       #27ae60;
      --green-bg:    #edfff5;
      --green-brd:   #b0e0c0;
      --blur-bg:     rgba(253, 243, 224, 0.88);
      --radius:      14px;
      --radius-sm:   10px;
      --shadow-card: 0 2px 12px rgba(0,0,0,0.05);
      --shadow-now:  0 8px 28px rgba(253,1,79,0.12);
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #e2d8cc;
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .phone {
      width: 100%;
      max-width: 390px;
      min-height: 100vh;
      background: var(--cream);
      position: relative;
    }

    /* ── FIXED HEADER STACK ── */
    .fixed-stack {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 390px;
      z-index: 100;
    }

    /* top nav */
    .top-nav {
      background: rgba(253, 243, 224, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid transparent;
      padding: 14px 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .nav-back {
      width: 36px; height: 36px; background: none; border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; border-radius: 50%; flex-shrink: 0; color: var(--pink);
    }
    .nav-back:active { background: var(--pink-bg); }

    .nav-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 15px; font-weight: 700; color: var(--dark);
      flex: 1; text-align: center;
    }

    .nav-more {
      width: 36px; height: 36px; background: none; border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; border-radius: 50%; flex-shrink: 0; color: var(--mid);
    }

    /* trip tile */
    .trip-tile {
      background: linear-gradient(160deg, var(--cream-warm) 0%, var(--cream-deep) 100%);
      border-bottom: 1px solid rgba(253,1,79,0.08);
      padding: 12px 18px 14px;
      position: relative;
      overflow: hidden;
    }
    .trip-tile::after {
      content: '';
      position: absolute;
      right: -20px; top: -20px;
      width: 90px; height: 90px;
      background: rgba(253,1,79,0.05);
      border-radius: 50%;
      pointer-events: none;
    }

    .tile-row1 {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .trip-route {
      font-family: 'Montserrat', sans-serif;
      font-size: 14px; font-weight: 800; color: var(--dark);
    }

    .trip-countdown {
      color: var(--pink); font-size: 12px; font-weight: 700;
    }

    .trip-dates {
      font-size: 11px; color: var(--mid); margin-bottom: 6px;
    }

    .tile-row2 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .watching-dot { display: flex; align-items: center; }
    .watching-text { font-size: 10px; color: var(--grey-text); font-weight: 500; }

    .trip-id-text { font-size: 10px; color: #bbb; }

    .progress-wrap { }
    .progress-bar-bg {
      height: 4px; background: rgba(253,1,79,0.1);
      border-radius: 4px; overflow: hidden; margin-bottom: 3px;
    }
    .progress-fill {
      height: 100%; background: var(--pink); border-radius: 4px;
      transition: width 0.5s ease;
    }
    .progress-label { font-size: 10px; color: var(--mid); }

    /* ── SCROLL AREA ── */
    .scroll-area {
      padding-top: 152px;
      padding-bottom: 90px;
    }

    /* ── SECTION HEADERS ── */
    .section-head {
      padding: 20px 18px 8px;
      font-size: 11px; font-weight: 700;
      color: var(--grey-text); letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    /* ── CARD LIST ── */
    .card-list { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }

    /* DONE cards */
    .done-card {
      background: var(--white);
      border-radius: var(--radius-sm);
      padding: 11px 12px;
      display: flex; align-items: center; gap: 10px;
      opacity: 0.72;
    }
    .done-tick {
      width: 20px; height: 20px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }

    .item-text { flex: 1; min-width: 0; }
    .item-title {
      font-size: 13px; font-weight: 600; color: #555;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .item-meta {
      font-size: 11px; color: var(--grey-text); margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ── ACTIVE (NOW) CARD ── */
    .active-card {
      margin: 0 16px;
      background: var(--white);
      border-radius: var(--radius);
      border: 1px solid rgba(253,1,79,0.12);
      border-left: 3px solid var(--pink);
      box-shadow: 0 4px 20px rgba(253,1,79,0.08);
      overflow: hidden;
      transition: opacity 0.32s ease, transform 0.32s ease;
    }

    .active-header {
      padding: 14px 16px 10px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .active-title-wrap { flex: 1; min-width: 0; }
    .active-label {
      font-size: 9px; font-weight: 700; color: var(--pink);
      letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px;
    }
    .active-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 15px; font-weight: 700; color: var(--dark);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .active-meta { font-size: 11px; color: var(--grey-text); margin-top: 2px; }

    /* no pink-box, no pulse-badge — replaced by simple NOW dot */
    .now-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--pink); flex-shrink: 0;
      animation: pulse-badge 2s infinite;
    }
    @keyframes pulse-badge {
      0%, 100% { box-shadow: 0 0 0 0 rgba(253,1,79,0.3); }
      50%       { box-shadow: 0 0 0 5px rgba(253,1,79,0); }
    }

    .active-divider {
      height: 1px; background: rgba(0,0,0,0.05); margin: 0 16px;
    }

    .active-body { padding: 14px 16px 16px; }

    .item-checklist { margin-bottom: 14px; }
    .check-row {
      display: flex; align-items: flex-start; gap: 10px;
      margin-bottom: 8px; font-size: 13px; color: var(--dark); line-height: 1.45;
    }
    .check-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--pink); flex-shrink: 0; margin-top: 6px;
    }

    /* primary CTA — mark done */
    .btn-done {
      display: block; width: 100%;
      background: var(--pink); color: white;
      border: none; border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-family: 'Poppins', sans-serif;
      font-size: 13px; font-weight: 600;
      cursor: pointer; text-align: center;
    }
    .btn-done:active { opacity: 0.88; }

    /* secondary — ask assistant */
    .btn-chat {
      display: block; width: 100%; margin-top: 10px;
      background: none; border: none;
      font-family: 'Poppins', sans-serif;
      font-size: 12px; font-weight: 500; color: var(--grey-text);
      cursor: pointer; text-align: center; text-decoration: none;
      padding: 4px 0;
    }
    .btn-chat:active { color: var(--pink); }
    .btn-chat:hover  { color: var(--pink); }

    /* UPCOMING cards */
    .upcoming-card {
      background: var(--white);
      border-radius: var(--radius-sm);
      padding: 11px 12px;
      display: flex; align-items: center; gap: 10px;
    }
    .pending-ring { flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%; transform: translateX(-50%) translateY(10px);
      background: var(--dark); color: white;
      padding: 10px 18px; border-radius: 20px;
      font-size: 13px; font-weight: 500;
      opacity: 0; transition: opacity 0.2s, transform 0.2s;
      pointer-events: none; white-space: nowrap; z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── BOTTOM NAV ── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 390px;
      z-index: 100;
      background: rgba(253, 243, 224, 0.95);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid rgba(253,1,79,0.08);
      padding: 10px 0 20px;
      display: flex;
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; gap: 3px;
      cursor: pointer; text-decoration: none;
      padding: 4px 0;
    }
    .nav-icon { font-size: 18px; }
    .nav-label { font-size: 10px; font-weight: 500; color: var(--grey-text); }
    .nav-item.active .nav-label { color: var(--pink); font-weight: 700; }
    .nav-item.active .nav-icon { filter: none; }
  </style>
</head>
<body>
<div class="phone">

  <!-- ── FIXED HEADER ── -->
  <div class="fixed-stack">
    <div class="top-nav">
      <button class="nav-back" onclick="goHome()" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
      </button>
      <span class="nav-title">Trip Checklist</span>
      <button class="nav-more" aria-label="More">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="19" r="1.5" fill="currentColor"/>
        </svg>
      </button>
    </div>
    <div class="trip-tile">
      <div class="tile-row1">
        <div class="trip-route" id="trip-route">Mumbai → Bali</div>
        <div class="trip-countdown" id="trip-countdown">7 days to go</div>
      </div>
      <div class="trip-dates" id="trip-dates">May 7–14, 2025</div>
      <div class="tile-row2">
        <div class="watching-dot">
          <span class="watching-text">Updated 1d ago</span>
        </div>
        <span class="trip-id-text" id="trip-id">Booking #BL-4821</span>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar-bg">
          <div class="progress-fill" id="progress-fill" style="width:50%"></div>
        </div>
        <div class="progress-label" id="progress-label">4 / 8 done</div>
      </div>
    </div>
  </div>

  <!-- ── SCROLL AREA ── -->
  <div class="scroll-area">

    <!-- Done -->
    <div class="section-head">Done</div>
    <div class="card-list" id="done-list"></div>

    <!-- Now -->
    <div class="section-head" id="now-anchor">Now</div>
    <div class="active-card" id="active-card">
      <div class="active-header">
        <div class="active-title-wrap">
          <div class="active-label">Up next</div>
          <div class="active-title" id="now-title">Pack your bags</div>
          <div class="active-meta" id="now-meta">Departs in 7 days</div>
        </div>
        <div class="now-dot"></div>
      </div>
      <div class="active-divider"></div>
      <div class="active-body">
        <div class="item-checklist" id="now-items"></div>
        <button class="btn-done" onclick="markDone()">Mark as done</button>
        <a class="btn-chat" id="now-cta" href="#">Ask the assistant</a>
      </div>
    </div>

    <!-- Coming Up -->
    <div class="section-head">Coming Up</div>
    <div class="card-list" id="upcoming-list"></div>

    <div style="height:8px"></div>
  </div>

  <!-- ── TOAST ── -->
  <div class="toast" id="toast">✓ Marked as done!</div>

  <!-- ── BOTTOM NAV ── -->
  <div class="bottom-nav">
    <a class="nav-item" href="index.html">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Home</span>
    </a>
    <a class="nav-item active" href="#">
      <span class="nav-icon">📋</span>
      <span class="nav-label">Checklist</span>
    </a>
    <a class="nav-item" id="nav-chat-link" href="#">
      <span class="nav-icon">💬</span>
      <span class="nav-label">Chat</span>
    </a>
    <a class="nav-item" href="#">
      <span class="nav-icon">📄</span>
      <span class="nav-label">Docs</span>
    </a>
  </div>

</div>

<script src="trips-data.js"></script>
<script>
// ── Auth guard ─────────────────────────────────────────────────────────────
if (sessionStorage.getItem('30s_auth') !== '1') {
  const dest = encodeURIComponent(location.href);
  location.replace('index.html?next=' + dest);
}
</script>
<script>
// ── Load trip from URL param ───────────────────────────────────────────────
const tripId = new URLSearchParams(location.search).get('trip') || 'bali';
const trip = TRIPS[tripId];

if (!trip) {
  document.body.innerHTML = '<div style="padding:40px;text-align:center;font-family:Poppins,sans-serif">Trip not found. <a href="index.html">Go home</a></div>';
  throw new Error('Trip not found: ' + tripId);
}

const cl = trip.checklist;

// ── Update header ──────────────────────────────────────────────────────────
document.title = `Checklist — ${trip.destination} · 30 Sundays`;
document.getElementById('trip-route').textContent = trip.route;
document.getElementById('trip-countdown').textContent =
  trip.daysLeft <= 0 ? 'On trip!' :
  trip.daysLeft === 1 ? '1 day to go' :
  `${trip.daysLeft} days to go`;
document.getElementById('trip-dates').textContent = trip.dates;
document.getElementById('trip-id').textContent = `Booking #${trip.bookingId}`;
document.getElementById('progress-fill').style.width = trip.progress.pct;
document.getElementById('progress-label').textContent = `${trip.progress.done} / ${trip.progress.total} done`;

// ── Render done items ──────────────────────────────────────────────────────
const doneList = document.getElementById('done-list');
cl.done.forEach(item => {
  const el = document.createElement('div');
  el.className = 'done-card';
  el.innerHTML = `
    <div class="done-tick">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FD014F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <div class="item-text">
      <div class="item-title">${item.title}</div>
      <div class="item-meta">${item.meta}</div>
    </div>`;
  doneList.appendChild(el);
});

// ── Render NOW card ────────────────────────────────────────────────────────
const now = cl.now;
document.getElementById('now-title').textContent = now.title;
document.getElementById('now-meta').textContent = now.meta;

// items — show max 3 to avoid overload
const itemsWrap = document.getElementById('now-items');
now.items.slice(0, 3).forEach(item => {
  const row = document.createElement('div');
  row.className = 'check-row';
  const dot = document.createElement('div');
  dot.className = 'check-dot';
  const txt = document.createElement('span');
  txt.textContent = item;
  row.appendChild(dot);
  row.appendChild(txt);
  itemsWrap.appendChild(row);
});

// CTA button
document.getElementById('now-cta').href = now.cta.link;

// ── Render upcoming items ──────────────────────────────────────────────────
const upcomingList = document.getElementById('upcoming-list');
cl.upcoming.forEach(item => {
  const el = document.createElement('div');
  el.className = 'upcoming-card';
  el.innerHTML = `
    <div class="pending-ring">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <circle cx="10" cy="10" r="7.5" stroke="#FD014F" stroke-width="1.5" stroke-dasharray="2.8 2.8" opacity="0.35"/>
      </svg>
    </div>
    <div class="item-text">
      <div class="item-title">${item.title}</div>
      <div class="item-meta">${item.meta}</div>
    </div>`;
  upcomingList.appendChild(el);
});

// ── Chat nav link ──────────────────────────────────────────────────────────
document.getElementById('nav-chat-link').href = `chat.html?trip=${trip.id}`;

// ── Mark done ─────────────────────────────────────────────────────────────
function markDone() {
  const card = document.getElementById('active-card');
  card.style.opacity = '0';
  card.style.transform = 'scale(0.97)';
  setTimeout(() => { card.style.display = 'none'; }, 330);

  const newDone = trip.progress.done + 1;
  const pct = Math.round((newDone / trip.progress.total) * 100) + '%';
  document.getElementById('progress-fill').style.width = pct;
  document.getElementById('progress-label').textContent = `${newDone} / ${trip.progress.total} done`;

  showToast('✓ Marked as done!');
}

// ── Toast ──────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

// ── Auto-scroll to Now on load ─────────────────────────────────────────────
function goHome() {
  window.location.href = 'index.html';
}

window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    const anchor = document.getElementById('now-anchor');
    const header = document.querySelector('.fixed-stack');
    if (anchor) {
      const headerH = header ? header.getBoundingClientRect().height : 152;
      const top = anchor.getBoundingClientRect().top + window.scrollY - headerH - 8;
      window.scrollTo({ top, behavior: 'smooth' });
    }
  }, 350);
});
</script>
</body>
</html>
